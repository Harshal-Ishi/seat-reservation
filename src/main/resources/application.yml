spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      # A request waiting for a DB connection parks a cheap virtual thread instead of holding one of
      # Tomcat's 200 platform threads, so a burst queues on the connection pool rather than on threads.
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast instead of the 30s default: a request waiting this long is better declined (429)
      # than left hanging, and readiness reports DB-down quickly.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      # MySQL defaults to REPEATABLE READ, which takes gap locks and deadlocks more under a burst.
      # READ COMMITTED locks only the rows actually touched.
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # InnoDB waits 50s for a row lock by default. A request stuck that long is better declined (429)
      # so its connection goes back to the pool.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = ${DB_LOCK_WAIT_TIMEOUT_SECONDS:5}
      data-source-properties:
        # Sends a JDBC batch as one multi-row INSERT; without it a 10,000-seat show is 10,000 round trips.
        rewriteBatchedStatements: true
        # Opening a new connection (TCP + TLS handshake) is separate from waiting for a pooled one above. On a
        # tiny CPU share the handshake alone can take several seconds; the pool keeps connections open, so this
        # only matters at startup and on reconnects.
        connectTimeout: ${DB_CONNECT_TIMEOUT_MS:30000}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Money is integer paise: reject 250.5 instead of silently truncating it to 250.
      accept-float-as-int: false

server:
  # Hosting platforms inject PORT.
  port: ${PORT:8080}

logging:
  structured:
    format:
      # One JSON object per line (Logstash layout), including MDC fields such as request_id and user_id.
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        # Readiness must fail closed when the DB is unreachable; liveness must not,
        # or the platform would restart-loop the app during a DB outage.
        readiness:
          include: readinessState,db
