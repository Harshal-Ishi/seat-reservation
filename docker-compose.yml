# Local run: docker compose up --build
# Credentials here are for local use only; the deployed service gets its own from the platform.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/seats
      DB_USERNAME: seats
      DB_PASSWORD: seats
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
