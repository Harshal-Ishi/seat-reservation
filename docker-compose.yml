# Local run: docker compose up --build
# Credentials here are for local use only; the deployed service gets its own from the platform.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: seats
      MYSQL_ROOT_PASSWORD: seats
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pseats --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      # allowPublicKeyRetrieval: MySQL 8's default auth needs it over a non-TLS connection (local only).
      DB_URL: jdbc:mysql://db:3306/seats?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: seats
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
